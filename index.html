<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Đào Trứng Vàng Kawaii Pro - Học Tiếng Anh</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#FFB7B2;--accent:#FFD93D;--dark:#2B2D42;--danger:#FF4D4D}
body{margin:0;background:#f0fdf4;overflow:hidden;font-family:'Lexend',Arial,sans-serif;user-select:none;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;width:96%;max-width:650px;pointer-events:none}
.hud-item{background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 10px;border-radius:999px;color:var(--dark);font-weight:700;flex:1;text-align:center;border:1.5px solid rgba(255,255,255,.9);font-size:.82rem;box-shadow:0 4px 14px rgba(43,45,66,.16);white-space:nowrap}
#target{position:fixed;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;background:linear-gradient(135deg,#7C5CFC,#FF6FA5);border-radius:20px;padding:6px 22px;box-shadow:0 8px 22px rgba(124,92,252,.38);text-align:center;font-weight:700;color:#fff;white-space:nowrap}
#target small{display:block;font-size:.66rem;color:rgba(255,255,255,.85);font-weight:400}
#target b{font-size:1.4rem;font-weight:900}
.pop{animation:pop .4s}
@keyframes pop{50%{filter:brightness(1.2);box-shadow:0 0 0 6px rgba(255,255,255,.6)}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:rgba(43,45,66,.6);backdrop-filter:blur(8px);padding:20px}
.card{background:linear-gradient(180deg,#fff,#fbf4ff);padding:24px;border-radius:28px;text-align:center;box-shadow:0 24px 60px rgba(30,20,60,.4);max-width:350px;width:90%;border:1.5px solid rgba(255,255,255,.9);max-height:88vh;overflow-y:auto}
input{width:85%;padding:12px;border-radius:15px;border:2px solid #e5d5ff;background:#fff;margin:10px 0;font:700 1rem 'Lexend',sans-serif;text-align:center;outline:none}
.btn{background:linear-gradient(135deg,#FF8FB1,#FF6FA5);color:#fff;border:0;padding:14px 25px;border-radius:18px;font:700 1.05rem 'Lexend',sans-serif;cursor:pointer;width:100%;margin-top:10px;box-shadow:0 8px 20px rgba(255,111,165,.45);transition:.12s}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 3px 8px rgba(255,111,165,.4)}
.hidden{display:none!important}
#leaderboard-list{max-height:130px;overflow-y:auto;text-align:left}
.rank-item{display:flex;justify-content:space-between;padding:5px 10px;border-bottom:1px solid #eee;font-weight:700;font-size:.85rem}
.rank-item.highlight{background:#fef08a;border-radius:8px;color:#854d0e}
.box{background:#f8fafc;border-radius:16px;padding:8px 10px;border:1px solid #eadbff;margin-bottom:8px;text-align:left;font-size:.78rem;font-weight:700;color:#334155}
.box h4{margin:0 0 4px;font-size:.72rem;text-transform:uppercase;color:#475569}
.shake{animation:shake .4s both}
@keyframes shake{20%,80%{transform:translate3d(4px,0,0)}30%,50%,70%{transform:translate3d(-6px,0,0)}40%,60%{transform:translate3d(6px,0,0)}}
.lv-row{display:flex;gap:6px;margin:6px 0 2px}.lv{flex:1;border:2px solid #e5d5ff;background:#fff;border-radius:14px;padding:8px 2px;font:700 .78rem 'Lexend',sans-serif;color:var(--dark);cursor:pointer;line-height:1.25}.lv b{display:block;font-size:1.2rem}.lv.on{border-color:#7C5CFC;background:linear-gradient(135deg,#efe7ff,#ffe3ee);box-shadow:0 4px 12px rgba(124,92,252,.3)}#lv-desc{font-size:.72rem;color:#64748b;margin:4px 0 2px;min-height:3em}
#quit-btn{pointer-events:auto;flex:0 0 36px;width:36px;height:36px;align-self:center;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(43,45,66,.85);color:#fff;font:900 1rem 'Lexend',sans-serif;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(43,45,66,.35);padding:0}
#quit-btn:active{transform:scale(.92)}
.sec{font-size:.68rem;font-weight:700;text-transform:uppercase;color:#7c6aa8;margin:8px 0 0;text-align:left;letter-spacing:.04em}
</style>
</head>
<body>
<div id="hud">
  <div class="hud-item">⭐ <span id="score">0</span></div>
  <div class="hud-item" id="combo-display">🔥 x1</div>
  <div class="hud-item" id="lives-box">❤️ <span id="lives">3</span></div>

<div id="target" class="hidden"><small>Tìm trứng có từ tiếng Anh nghĩa là:</small><b id="target-text"></b></div>

  <div style="font-size:2.4rem;line-height:1">🥚</div><h1 style="margin:4px 0 6px;font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,#7C5CFC,#FF6FA5);-webkit-background-clip:text;background-clip:text;color:transparent">ĐÀO TRỨNG VÀNG</h1>
  <p style="color:#666;font-size:.85rem;margin:0 0 6px">Đọc nghĩa tiếng Việt, câu đúng quả trứng có từ tiếng Anh tương ứng! Đúng được thưởng điểm 🔊</p>
  <div class="sec">Độ khó</div>
  <div class="lv-row"><button class="lv" data-lv="easy"><b>🌱</b>Dễ</button><button class="lv" data-lv="medium"><b>⭐</b>Trung bình</button><button class="lv" data-lv="hard"><b>🔥</b>Khó</button></div><div id="lv-desc"></div>

  <div class="lv-row"><button class="lv" data-md="classic"><b>♾️</b>Cổ điển</button><button class="lv" data-md="t30"><b>⚡</b>30 giây</button><button class="lv" data-md="t45"><b>🕐</b>45 giây</button><button class="lv" data-md="t60"><b>⏱️</b>60 giây</button></div><div id="md-desc"></div>
  <input type="text" id="player-name" placeholder="Nhập tên của bạn..." maxlength="12">

</div></div>

<div id="game-over" class="overlay hidden"><div class="card">

  <div id="final-score" style="font-size:2.3rem;font-weight:900;color:var(--primary)">0</div></div>
  <div class="box"><h4>✅ Từ đã học</h4><div id="learned"></div></div>

  <button class="btn" id="retry-btn-action">CHƠI LẠI</button>
</div></div>

<canvas id="gameCanvas"></canvas>

<script>
const CONFIG={hookY:135,groundY:199,minAngle:.15,maxAngle:Math.PI-.15,extendSpeed:18,baseRetractSpeed:12,localKey:'gold_miner_leaderboard_v2'};
let canvas,ctx,scoreEl,livesEl,timeEl,comboEl,startScreen,gameOverEl,finalScoreEl,leaderboardList,nameInput,targetEl,targetText;
let playerName='Vô danh',width,height,score,timeLeft,gameActive=false,timerInterval,lives,comboCount=0,lastGameId=null,target=null;
const items=[],particles=[],clouds=[],notices=[],learned=new Map(),missed=new Map();let targetSince=0;

// ---- Từ vựng: [từ, nghĩa, emoji]
const VOCAB=[['apple','quả táo','🍎'],['banana','quả chuối','🍌'],['cat','con mèo','🐱'],['dog','con chó','🐶'],['fish','con cá','🐟'],['bird','con chim','🐦'],['sun','mặt trời','☀️'],['moon','mặt trăng','🌙'],['star','ngôi sao','⭐'],['tree','cái cây','🌳'],['flower','bông hoa','🌸'],['book','quyển sách','📖'],['house','ngôi nhà','🏠'],['car','xe hơi','🚗'],['milk','sữa','🥛'],['egg','quả trứng','🥚'],['bread','bánh mì','🍞'],['water','nước','💧'],['cake','bánh ngọt','🍰'],['rain','mưa','🌧️'],['snow','tuyết','❄️'],['fire','lửa','🔥'],['hat','cái mũ','🎩'],['shoe','chiếc giày','👟'],['ball','quả bóng','⚽'],['heart','trái tim','❤️'],['bus','xe buýt','🚌'],['pizza','bánh pizza','🍕'],['duck','con vịt','🦆'],['rabbit','con thỏ','🐰']];
const EASY_WORDS=['apple','banana','cat','dog','fish','bird','sun','moon','star','tree','flower','book','house','car','milk','egg','ball','hat','bus','duck'];
const VOCAB_HARD=[['umbrella','cái ô','☂️'],['elephant','con voi','🐘'],['butterfly','con bướm','🦋'],['mountain','ngọn núi','⛰️'],['window','cửa sổ','🪟'],['strawberry','quả dâu tây','🍓'],['watermelon','dưa hấu','🍉'],['airplane','máy bay','✈️'],['rainbow','cầu vồng','🌈'],['giraffe','con hươu cao cổ','🦒'],['penguin','chim cánh cụt','🐧'],['guitar','đàn ghi-ta','🎸'],['camera','máy ảnh','📷'],['rocket','tên lửa','🚀'],['crown','vương miện','👑'],['bicycle','xe đạp','🚲'],['pineapple','quả dứa','🍍'],['octopus','con bạch tuộc','🐙'],['dinosaur','khủng long','🦖'],['balloon','bóng bay','🎈'],['key','chìa khóa','🔑'],['clock','đồng hồ','⏰'],['candle','cây nến','🕯️'],['spider','con nhện','🕷️'],['turtle','con rùa','🐢'],['carrot','cà rốt','🥕'],['tomato','cà chua','🍅'],['lemon','quả chanh','🍋'],['cookie','bánh quy','🍪'],['butter','bơ','🧈']];
// ---- Cấp độ: time/cap/bonus = giờ bắt đầu/tối đa/thưởng mỗi từ đúng; swing/extend/retract = tốc độ móc; eggs = số trứng (trên 12 vật); crab = tốc độ cua; eggMove = tốc độ trứng di chuyển; hint = ms trước khi hiện vòng gợi ý; wrongPts/wrongTime/wrongCombo = phạt khi câu sai trứng
const EASY_EXTRA=[['pig','con heo','🐷'],['cow','con bò','🐮'],['horse','con ngựa','🐴'],['lion','sư tử','🦁'],['monkey','con khỉ','🐵'],['frog','con ếch','🐸'],['bee','con ong','🐝'],['ant','con kiến','🐜'],['orange','quả cam','🍊'],['grape','quả nho','🍇'],['pear','quả lê','🍐'],['corn','bắp ngô','🌽'],['rice','cơm','🍚'],['hand','bàn tay','✋'],['eye','con mắt','👁️'],['ear','cái tai','👂'],['nose','cái mũi','👃'],['mouth','cái miệng','👄'],['bed','cái giường','🛏️'],['chair','cái ghế','🪑'],['door','cửa ra vào','🚪'],['cup','cái cốc','🥤'],['spoon','cái thìa','🥄'],['pen','cây bút','🖊️'],['bag','cái cặp','🎒'],['red','màu đỏ','🔴'],['blue','màu xanh dương','🔵'],['green','màu xanh lá','🟢'],['yellow','màu vàng','🟡']];
const MED_EXTRA=[['tiger','con hổ','🐯'],['bear','con gấu','🐻'],['panda','gấu trúc','🐼'],['zebra','ngựa vằn','🦓'],['snake','con rắn','🐍'],['chicken','con gà','🐔'],['sheep','con cừu','🐑'],['mouse','con chuột','🐭'],['cherry','quả anh đào','🍒'],['peach','quả đào','🍑'],['potato','khoai tây','🥔'],['onion','củ hành','🧅'],['cheese','phô mai','🧀'],['candy','kẹo','🍬'],['tea','trà','🍵'],['soup','món súp','🍲'],['train','tàu hỏa','🚆'],['boat','con thuyền','⛵'],['truck','xe tải','🚚'],['phone','điện thoại','📱'],['computer','máy tính','💻'],['television','ti vi','📺'],['lamp','bóng đèn','💡'],['scissors','cái kéo','✂️'],['glasses','kính mắt','👓'],['shirt','cái áo','👕'],['dress','cái váy','👗'],['socks','đôi tất','🧦'],['gloves','găng tay','🧤'],['cloud','đám mây','☁️'],['wind','gió','💨'],['tooth','cái răng','🦷'],['bone','cái xương','🦴'],['gift','món quà','🎁'],['bell','cái chuông','🔔'],['flag','lá cờ','🚩'],['medal','huy chương','🏅'],['school','trường học','🏫'],['hospital','bệnh viện','🏥'],['tent','cái lều','⛺']];
const HARD_EXTRA=[['kangaroo','chuột túi','🦘'],['crocodile','cá sấu','🐊'],['dolphin','cá heo','🐬'],['whale','cá voi','🐳'],['shark','cá mập','🦈'],['owl','con cú','🦉'],['eagle','đại bàng','🦅'],['parrot','con vẹt','🦜'],['scorpion','con bọ cạp','🦂'],['hedgehog','con nhím','🦔'],['squirrel','con sóc','🐿️'],['pumpkin','quả bí ngô','🎃'],['broccoli','súp lơ xanh','🥦'],['mushroom','cây nấm','🍄'],['avocado','quả bơ','🥑'],['coconut','quả dừa','🥥'],['sandwich','bánh sandwich','🥪'],['hamburger','bánh hamburger','🍔'],['sausage','xúc xích','🌭'],['helicopter','trực thăng','🚁'],['ambulance','xe cứu thương','🚑'],['ship','tàu thủy','🚢'],['tractor','máy kéo','🚜'],['telescope','kính thiên văn','🔭'],['microscope','kính hiển vi','🔬'],['magnet','nam châm','🧲'],['battery','pin','🔋'],['hammer','cái búa','🔨'],['envelope','phong bì','✉️'],['calendar','cuốn lịch','📅'],['trophy','cúp vô địch','🏆'],['diamond','kim cương','💎'],['volcano','núi lửa','🌋'],['island','hòn đảo','🏝️'],['castle','lâu đài','🏰'],['bridge','cây cầu','🌉'],['lightning','tia chớp','⚡'],['tornado','lốc xoáy','🌪️'],['snowman','người tuyết','⛄'],['ghost','con ma','👻'],['dragon','con rồng','🐉'],['unicorn','kỳ lân','🦄'],['wizard','phù thủy','🧙']];
const uniq=a=>{const q=new Set();return a.filter(v=>!q.has(v[0])&&q.add(v[0]))};
let deck=[];
const LEVELS={
 easy:{name:'Dễ',time:45,cap:60,bonus:4,lives:5,swing:.013,extend:20,retract:20,eggs:9,noBomb:true,crab:1.5,eggMove:0,hint:4000,wrongPts:.5,wrongTime:0,wrongCombo:false,vocab:uniq(VOCAB.filter(v=>EASY_WORDS.includes(v[0])).concat(EASY_EXTRA)),desc:'§từ quen thuộc · 5 mạng · 45 giây · móc chậm · không có bom · sai không mất combo'},
 medium:{name:'Trung bình',time:30,cap:45,bonus:3,lives:3,swing:.018,extend:22,retract:18,eggs:8,noBomb:false,crab:2.5,eggMove:0,hint:7000,wrongPts:.5,wrongTime:0,wrongCombo:true,vocab:uniq(VOCAB.concat(MED_EXTRA)),desc:'§từ cơ bản · 3 mạng · 30 giây · có bom và trứng thối'},
 hard:{name:'Khó',time:25,cap:35,bonus:2,lives:3,swing:.026,extend:26,retract:16,eggs:7,badBoost:true,crab:3.5,eggMove:1.3,hint:1e9,wrongPts:0,wrongTime:3,wrongCombo:true,vocab:uniq(VOCAB_HARD.concat(HARD_EXTRA)),desc:'§từ dài/khó · móc nhanh · trứng di chuyển · nhiều bom · không gợi ý · sai bị -3 giây và 0 điểm'}
};
Object.values(LEVELS).forEach(l=>l.desc=l.desc.replace('§',l.vocab.length+' '));
let level='medium',LV=LEVELS.medium;

// ---- Chế độ thời gian: classic = theo cấp độ (đúng thì cộng giây); t30/t60 = đồng hồ cố định, đua điểm trong 30s/60s
const MODES={
 classic:{name:'Cổ điển',desc:'♾️ Không giới hạn thời gian. Mỗi lần câu phải trứng thối hoặc bom mất 1 mạng, đủ 3 lần là thua.'},
 t30:{name:'30 giây',t:30,desc:'⚡ Đồng hồ cố định 30 giây, không cộng giờ. Hãy kiếm điểm thật nhanh!'},
 t45:{name:'45 giây',t:45,desc:'🕐 Đồng hồ cố định 45 giây, không cộng giờ. Vừa đủ để chơi thoải mái!'},
 t60:{name:'60 giây',t:60,desc:'⏱️ Đồng hồ cố định 60 giây, không cộng giờ. Đủ thời gian để lập kỷ lục!'}
};
let mode='classic',GT={time:30,cap:45,bonus:3};
const lvKey=()=>(level==='medium'?CONFIG.localKey:CONFIG.localKey+'_'+level)+(mode==='classic'?'':'_'+mode);
function lvText(){let d=LV.desc;if(mode==='classic')d=d.replace(/· \d+ mạng · \d+ giây ?/,'').replace(/ · sai bị -3 giây và 0 điểm/,' · sai không được điểm');return d}
function setLevel(l){level=l;deck=[];LV=LEVELS[l];try{localStorage.setItem('egg_level',l)}catch(e){}
 document.querySelectorAll('[data-lv]').forEach(b=>b.classList.toggle('on',b.dataset.lv===l));
 document.getElementById('lv-desc').textContent=lvText()}
function setMode(m){mode=m;try{localStorage.setItem('egg_mode',m)}catch(e){}
 document.querySelectorAll('[data-md]').forEach(b=>b.classList.toggle('on',b.dataset.md===m));
 document.getElementById('md-desc').textContent=MODES[m].desc;document.getElementById('lv-desc').textContent=lvText()}

// ---- Giọng nói: chọn giọng tự nhiên nhất có sẵn, đọc từ + lời khen với ngữ điệu vui vẻ
let VOICE=null;
function pickVoice(){try{
 const score=v=>{const n=v.name;let s=0;
  if(/natural|neural|online/i.test(n))s+=50;
  if(/premium|enhanced/i.test(n))s+=30;
  if(/google/i.test(n))s+=25;
  if(/aria|jenny|ava|emma|samantha|allison|nicky|zoe|karen|serena|joanna|ivy|kendra/i.test(n))s+=20;
  if(/en[-_]US/i.test(v.lang))s+=10;
  if(/compact|espeak|novelty|bad news|whisper|zarvox|trinoids/i.test(n))s-=40;
  return s};
 const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
 VOICE=vs.sort((a,b)=>score(b)-score(a))[0]||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
const PRAISE=['Great!','Awesome!','Well done!','Super!','Nice one!','Perfect!','Yay!','Good job!'];
const PRAISE_COMBO=['Amazing!','Fantastic!',"You're on fire!",'Wow, incredible!','Wonderful!','Brilliant!'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function utter(txt,rate,pitch){const u=new SpeechSynthesisUtterance(txt);if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='en-US';u.rate=rate;u.pitch=pitch;u.volume=1;speechSynthesis.speak(u)}
function speak(t,warm=true,combo=0){try{
 if(!VOICE)pickVoice();
 speechSynthesis.cancel();
 const j=()=>Math.random()*.08;
 if(warm){
  utter(t+'!',.95+j(),1.18+j());                                   // chỉ đọc từ, giọng vui vẻ
 }else{
  utter(t,.88,1)                                                    // sai: đọc chậm, bình tĩnh để nghe lại từ
 }
}catch(e){}}

// ---- SVG nâng cấp (gradient, bóng, má hồng, highlight)
const svgToDataUri=s=>`data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(s)))}`;
const EGGP='M50 6C75 6 90 45 90 62C90 82 72 93 50 93C28 93 10 82 10 62C10 45 25 6 50 6Z';
const D='#2B2D42';

 const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;
 o.connect(g);g.connect(audioCtx.destination);

   ctx.beginPath();ctx.moveTo(hook.x+c*70,hook.y+sn*70);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
   ctx.translate(x2,y2);ctx.rotate(hook.angle);ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-8,-13);ctx.lineTo(-8,13);ctx.closePath();ctx.fill();ctx.restore()}}
 ctx.strokeStyle=D;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(hook.x,hook.y);ctx.lineTo(ex,ey);ctx.stroke();
 ctx.save();ctx.translate(ex,ey);ctx.rotate(hook.angle+Math.PI/2);
 ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,18,.5,Math.PI-.5);ctx.stroke();ctx.restore();
 if(hook.grabbedItem){const g=hook.grabbedItem;ctx.save();ctx.translate(Math.round(ex),Math.round(ey+22));ctx.rotate(g.rot);
  ctx.drawImage(imgs[g.type],-g.size,-g.size,g.size*2,g.size*2);ctx.restore()}

 for(let i=notices.length-1;i>=0;i--){const n=notices[i];n.y-=1.2;n.life-=.016;
  if(n.life<=0){notices.splice(i,1);continue}
  ctx.save();ctx.globalAlpha=Math.min(1,n.life);ctx.fillStyle=n.color;ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.font='bold 22px Lexend, Arial';ctx.textAlign='center';
  ctx.strokeText(n.text,n.x,n.y);ctx.fillText(n.text,n.x,n.y);ctx.restore()}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=.05;
  if(p.life<=0){particles.splice(i,1);continue}
  ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill();ctx.restore()}
 const now=performance.now();acc=Math.min(100,acc+(now-(lastT||now)));lastT=now;while(acc>=16.67){update();acc-=16.67}requestAnimationFrame(draw);
}
const burst=(x,y,color,n=10)=>{for(let i=0;i<n;i++)particles.push({x,y,life:1,color,vx:(Math.random()-.5)*15,vy:(Math.random()-.5)*15,size:2+Math.random()*4})};
const note=(text,x,y,color)=>notices.push({text,x,y,color,life:1.6});

function update(){
 if(!gameActive)return;
 items.forEach(it=>{if(it.active&&it.isMoving){
  let ay=0;
  for(const o of items){if(o===it||!o.active)continue;
   const dx=it.x+it.vx*10-o.x,dy=it.y-o.y,d=Math.hypot(dx,dy),R=it.size+o.size+24;
   if(d<R){const s=(R-d)/R;const dir=Math.abs(dy)<6?(it.y>it.homeY?1:-1):Math.sign(dy);ay+=dir*s*5;
    if(d<(it.size+o.size)*.8&&(o.x-it.x)*it.vx>0)it.vx*=-1}}
  it.vy=(it.vy||0)*.8+ay*.2+(ay?0:(it.homeY-it.y)*.004);
  it.x+=it.vx;it.y=Math.max(CONFIG.groundY+75,Math.min(height-55,it.y+it.vy));
  if(it.x<50||it.x>width-50)it.vx*=-1}});
 if(hook.state==='swinging'){hook.angle+=hook.speed;if(hook.angle>CONFIG.maxAngle||hook.angle<CONFIG.minAngle)hook.speed*=-1}
 else if(hook.state==='extending'){
  hook.length+=CONFIG.extendSpeed;
  const ex=hook.x+Math.cos(hook.angle)*hook.length,ey=hook.y+Math.sin(hook.angle)*hook.length;
  if(ex<0||ex>width||ey>height){hook.state='retracting';comboCount=0;updateHUD()}
  for(const it of items){
   if(it.active&&Math.hypot(ex-it.x,ey-it.y)<it.size){
    it.active=false;
    if(it.isBomb){
     score=Math.max(0,score+it.points);if(mode==='classic')lives--;updateHUD();playSound('boom');note(mode==='classic'?it.label:`${it.label} ${it.points}`,it.x,it.y,'#E63946');burst(it.x,it.y,'#FF4D4D',15);
     document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),400);
     hook.state='retracting';comboCount=0;if(lives<=0)triggerGameOver('HẾT MẠNG!');
    }else{hook.grabbedItem=it;hook.state='retracting'}
    break;
   }
  }
 }else if(hook.state==='retracting'){
  const sp=hook.grabbedItem?CONFIG.baseRetractSpeed/(1+(hook.grabbedItem.weight-1)*.4):CONFIG.baseRetractSpeed+15;
  hook.length-=sp;if(Math.floor(hook.length)%12===0)playSound('tick');
  if(hook.length<=50){
   const g=hook.grabbedItem;
   if(g){
    const baseP=g.points==='RANDOM'?Math.floor(Math.random()*301)+200:g.points,mx=hook.x,my=hook.y+100;
    if(g.isPenalty){if(mode==='classic'){lives--;note('-1 ❤️',mx,my,'#5D4037')}else{score=Math.max(0,score+g.points);note(`${g.points}`,mx,my,'#5D4037')}playSound('fail');comboCount=0;burst(mx,hook.y+35,'#84cc16')}
    else if(g.word&&target&&g.word!==target.word){
     missed.set(g.word,g.vi);if(LV.wrongCombo)comboCount=0;playSound('wrong');speak(g.word,false);
     const p=Math.floor(baseP*LV.wrongPts);score+=p;note(`${g.word} = ${g.vi} ✗`,mx,my,'#E11D48');note(`+${p}`,mx,my+26,'#64748b');if(LV.wrongTime&&mode!=='classic'){timeLeft=Math.max(0,timeLeft-LV.wrongTime);note(`-${LV.wrongTime}s ⌛`,mx,my+52,'#E11D48');if(timeLeft<=0){updateHUD();triggerGameOver('HẾT GIỜ!');return}}
    }else{
     comboCount++;const mul=Math.max(1,Math.floor(comboCount/2)+1);let p=baseP*mul;
     if(g.word){p+=150;learned.set(g.word,g.vi);missed.delete(g.word);timeLeft=Math.min(GT.cap,timeLeft+GT.bonus);speak(g.word,true,comboCount);
      note(`✓ ${g.word}!${GT.bonus?' +'+GT.bonus+'s':''}`,mx,my-26,'#0ea5e9');target=null}
     playSound('collect');score+=p;note(`+${p}${mul>1?' (x'+mul+')':''}`,mx,my,mul>1?'#E11D48':'#166534');burst(mx,hook.y+35,'#FFD93D');
    }
    updateHUD();hook.grabbedItem=null;if(lives<=0)triggerGameOver('HẾT MẠNG!');
   }
   hook.length=50;hook.state='swinging';
   if(gameActive){if(items.filter(i=>i.active&&i.word).length<3)spawnItems();else{ensureTarget();ensureBomb()}}
  }
 }
}

function triggerGameOver(reason){
 if(!gameActive)return;gameActive=false;
 document.getElementById('over-title').innerText=reason;finalScoreEl.innerText=score;
 saveLocalScore(playerName,score);renderLeaderboard();renderWords();
 gameOverEl.classList.remove('hidden');targetEl.classList.add('hidden');document.getElementById('quit-btn').classList.add('hidden');clearInterval(timerInterval);
}
function startGame(){
 const name=nameInput.value.trim();
 if(!name){nameInput.style.borderColor='var(--danger)';nameInput.placeholder='Vui lòng nhập tên!';return}
 nameInput.style.borderColor='var(--dark)';playerName=name;
 initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
 try{speechSynthesis.cancel();pickVoice()}catch(e){}
 document.getElementById('lives-box').style.display=mode==='classic'?'':'none';
 const M=MODES[mode];GT=M.t?{time:M.t,cap:M.t,bonus:0}:{time:Infinity,cap:Infinity,bonus:0};
 score=0;timeLeft=GT.time;lives=mode==='classic'?3:LV.lives;CONFIG.extendSpeed=LV.extend;CONFIG.baseRetractSpeed=LV.retract;hook.speed=LV.swing;comboCount=0;target=null;learned.clear();missed.clear();
 hook.length=50;hook.state='swinging';hook.grabbedItem=null;particles.length=0;notices.length=0;
 spawnItems();updateHUD();gameActive=true;
 startScreen.classList.add('hidden');gameOverEl.classList.add('hidden');targetEl.classList.remove('hidden');document.getElementById('quit-btn').classList.remove('hidden');
 clearInterval(timerInterval);
 timerInterval=setInterval(()=>{if(!gameActive||!isFinite(timeLeft))return;timeLeft--;timeEl.innerText=timeLeft;if(timeLeft<=0)triggerGameOver('HẾT GIỜ!')},1000);
}
function quitGame(){
 if(!gameActive)return;
 gameActive=false;clearInterval(timerInterval);
 try{speechSynthesis.cancel()}catch(e){}
 hook.length=50;hook.state='swinging';hook.grabbedItem=null;target=null;
 targetEl.classList.add('hidden');document.getElementById('quit-btn').classList.add('hidden');
 showStartScreen();
}
function showStartScreen(){startScreen.classList.remove('hidden');gameOverEl.classList.add('hidden')}

window.onload=()=>{bindUI();resize();draw()};
window.onresize=resize;
window.onpointerdown=e=>{
 if(gameActive&&hook.state==='swinging'&&!e.target.closest('.card')&&!e.target.closest('input')&&!e.target.closest('#quit-btn')){
  initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();hook.state='extending';
 }
};
</script>
</body>
